     function tooglemenu() {
      const navlinks = document.getElementById('navlinks');
      const buttonid = document.getElementById('buttonid');

      // Toggles 'hidden' ONCE and saves true/false result
      const isHidden = navlinks.classList.toggle('hidden');

      // If isHidden is false, the menu is open
      if (!isHidden) {
        buttonid.innerHTML = "&times;";  
      } else {
        buttonid.innerHTML = "&#9776;";
      }
    }
     


     function innerheaderfirst () {
